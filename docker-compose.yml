version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: nosql_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: nosql_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: delivery
    restart: unless-stopped

volumes:
  redis_data:
  mongo_data:
